name: 功能建议 (Feature Request)
description: 为 Aster 提出新的功能或交互改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议！请尽量详细地描述您的使用场景与期望效果。
  - type: textarea
    id: problem
    attributes:
      label: 背景与痛点 (Problem Statement)
      description: 现有功能在什么场景下无法满足需求或不够友好？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案 (Proposed Solution)
      description: 您希望 Aster 如何实现或设计此功能？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或参考产品 (Alternatives or References)
      description: 是否有参考软件（如 Surge、Sparkle）的优秀做法或替代思路？
